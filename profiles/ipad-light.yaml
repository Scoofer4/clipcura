# Light files for editing on an iPad or a laptop
name: ipad-light
label: "iPad / notebook · 1080p"
fps: 30
max_long_side: 1920
audio_rate: 48000
color: rec709-sdr
output:
  codec: auto_h264       # h264_nvenc → h264_qsv → libx264, whichever this computer has
  container: mp4
  folder: "../02_edit"
  suffix: "_light"
rules:
  disabled: []
  vfr_deep_check: false
  loudness:              # EBU R128 measurement; report only (normalising changes the sound)
    measure: true
    target_lufs: -14       # social platforms; -23 for broadcast
    true_peak: -1
    fix: false
