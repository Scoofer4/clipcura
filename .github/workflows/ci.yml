# CI: lint and tests on Windows (the target platform) for every push and PR
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check .
      # The pinned FFmpeg build (~185 MB) is cached by the fetch script's content, which holds the pin.
      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/fetch_ffmpeg.py') }}
      - run: uv run python tools/fetch_ffmpeg.py
      # Runners have no GPU: this exercises the CPU path, which must always work on its own.
      - run: uv run clipcura doctor --quick
      # Also generates the synthetic clips the GUI end-to-end tests use.
      - run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # Playwright drives the Edge that ships with the runner (same engine as WebView2): no browser download.
      - run: npx playwright test
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: ui/test-results
          retention-days: 7
