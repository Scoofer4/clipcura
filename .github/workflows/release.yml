# Release (#21): build the portable ZIP and the installer on Windows and attach them to a draft GitHub Release.
# A version tag (v0.2.0) creates the draft; the owner reviews and publishes it. Run it by hand to only build the
# packages (they are kept as workflow artifacts for a week).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev

      - name: Tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          code=$(uv run python -c "import clipcura; print(clipcura.__version__)")
          project=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, clipcura.__version__ $code, pyproject $project"
          [ "$tag" = "$code" ] && [ "$tag" = "$project" ]

      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('clipcura/core/ffmpeg_build.py') }}
      - run: uv run python tools/fetch_ffmpeg.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui

      # Inno Setup 6 (found by tools/build_installer.py in its default folder).
      - run: choco install innosetup --no-progress -y

      # UI build, PyInstaller, smoke test of the frozen CLI with its bundled FFmpeg, ZIP, installer, checksums.
      - run: uv run python tools/build_installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: clipcura-packages
          path: |
            packaging/dist/*.zip
            packaging/dist/*.exe
            packaging/dist/SHA256SUMS.txt
          retention-days: 7

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python tools/release_notes.py release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Clipcura ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md --generate-notes \
            packaging/dist/*.zip packaging/dist/*.exe packaging/dist/SHA256SUMS.txt
