[project]
name = "clipsana"
version = "0.1.0"
keywords = ["ffmpeg", "video", "vfr", "davinci-resolve", "mcp", "gpu"]
description = "Check and fix footage so it edits smoothly in DaVinci Resolve - GUI for humans, MCP for AI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Metaverse Media s.r.o." }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "mcp>=1.2",          # oficiální MCP Python SDK (FastMCP)
    "pywebview>=5.0",    # nativní okno s WebView2 pro GUI
    "typer>=0.12",       # CLI
    "rich>=13.7",        # čitelný výstup CLI
]

[project.scripts]
clipsana = "clipsana.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipsana"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Frozen reference implementation of the first rules; kept byte-for-byte for comparison.
extend-exclude = ["tools/prototype"]

[tool.pytest.ini_options]
testpaths = ["tests"]
